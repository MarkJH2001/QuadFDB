[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadfdb"
version = "0.1.0"
description = "Real flight quadrotor motor fault diagnosis: numerical methods and event evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scikit-learn==1.9.1", "joblib>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
neural = ["torch>=2.5,<3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
